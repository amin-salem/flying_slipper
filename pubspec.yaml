name: flying_slipper
description: "دمپایی پرنده - Flying Slipper game"
publish_to: 'none'
version: 1.9.1+14

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # Saves coins, best score and purchases on the phone.
  shared_preferences: ^2.2.0
  # Talks to the game server (cloud save, leaderboard, purchases).
  http: ^1.2.2
  # Sound effects and music (0.10.6+ supports Android Gradle Plugin 9).
  just_audio: ^0.10.6
  # Share the result picture to Instagram / Telegram (13.x supports AGP 9).
  share_plus: ^13.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: '>=3.0.0 <8.0.0'

flutter:
  uses-material-design: true
  assets:
    - assets/sfx/
    - assets/music/
    - assets/voice/
  fonts:
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/Vazirmatn-Regular.ttf
        - asset: assets/fonts/Vazirmatn-Bold.ttf
          weight: 700
        - asset: assets/fonts/Vazirmatn-Black.ttf
          weight: 900
