# PostgreSQL + the API (+ Caddy for HTTPS in production). See README.md.
#   on your computer : docker compose up -d --build
#   on the server    : docker compose --profile prod up -d --build
services:
  db:
    image: ${IMAGE_PREFIX:-}postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: slipper
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: slipper
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U slipper"]
      interval: 5s
      retries: 10

  api:
    build:
      context: .
      # "host" lets the build use a VPN/proxy running on this computer (BUILD_PROXY)
      network: host
      args:
        IMAGE_PREFIX: ${IMAGE_PREFIX:-}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
        HTTP_PROXY: ${BUILD_PROXY:-}
        HTTPS_PROXY: ${BUILD_PROXY:-}
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://slipper:${POSTGRES_PASSWORD:-change-me}@db:5432/slipper
      # tables are made by "alembic upgrade head" (see README), not on start
      AUTO_CREATE_TABLES: "false"
    ports:
      # 127.0.0.1 = only this computer. Set API_BIND=0.0.0.0 in .env to test from your phone.
      - "${API_BIND:-127.0.0.1}:8000:8000"
    depends_on:
      db:
        condition: service_healthy

  # HTTPS for production only. Start it with:  docker compose --profile prod up -d
  caddy:
    profiles: ["prod"]
    image: ${IMAGE_PREFIX:-}caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - api

volumes:
  pgdata:
  caddy_data:
